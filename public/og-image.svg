<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Typing Coach</title>
  <desc id="description">Improve typing speed and accuracy with clear, focused practice.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbfa" />
      <stop offset="1" stop-color="#dcebe6" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#background)" />
  <circle cx="1050" cy="80" r="220" fill="#e5ad32" opacity="0.16" />
  <rect x="90" y="88" width="1020" height="454" rx="38" fill="#ffffff" stroke="#d7e1dd" stroke-width="3" />
  <rect x="90" y="88" width="1020" height="8" rx="4" fill="#0f766e" />
  <text x="150" y="245" fill="#0f766e" font-family="Arial, sans-serif" font-size="28" font-weight="700" letter-spacing="4">ACCURACY FIRST. SPEED FOLLOWS.</text>
  <text x="150" y="350" fill="#172522" font-family="Arial, sans-serif" font-size="86" font-weight="700">Typing Coach</text>
  <text x="150" y="420" fill="#52615d" font-family="Arial, sans-serif" font-size="32">Build speed and accuracy with focused typing practice.</text>
</svg>
